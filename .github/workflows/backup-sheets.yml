name: Respaldo Automático Google Sheets

on:
  schedule:
    # Se ejecuta todos los días a las 03:00 UTC (00:00 hora de Argentina)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite disparar el respaldo manualmente con 1 clic en GitHub

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Script de Respaldo
        run: |
          python -c "
          import os, urllib.request, json, datetime
          
          api_url = 'https://script.google.com/macros/s/AKfycbzE0NUBtDRgMQDmtDeUcy4QpO82lutlR-66wvWYpMLUsA2e0-01vcu3LrTFMlIdk7nFXg/exec'
              
          today = datetime.datetime.now().strftime('%Y-%m-%d')
          os.makedirs('backups', exist_ok=True)
          
          req = urllib.request.Request(api_url + '?action=all', headers={'User-Agent': 'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read().decode('utf-8'))
                  backup_path = f'backups/{today}_backup.json'
                  with open(backup_path, 'w', encoding='utf-8') as f:
                      json.dump(data, f, indent=2, ensure_ascii=False)
                  print(f'Respaldo guardado exitosamente en {backup_path}')
          except Exception as e:
              print(f'Error al respaldar: {e}')
          "

      - name: Commit y Push del Respaldo
        run: |
          git config --global user.name "Carnes Premium Backup Bot"
          git config --global user.email "bot@carnespremium.app"
          git add backups/
          if git diff --staged --quiet; then
            echo "No hay cambios para respaldar hoy."
          else
            git commit -m "chore(backup): respaldo automatico $(date +'%Y-%m-%d')"
            git push
          fi
